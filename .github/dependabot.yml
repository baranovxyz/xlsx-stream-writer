version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  # Workflow actions are pinned to commit SHAs, so they cannot pick up upstream
  # fixes on their own. Dependabot is what moves those pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The next two entries watch the 0.2.x maintenance line, which ships jszip and
  # stream-browserify where master ships nothing. `target-branch` covers one
  # branch per entry, so a second branch means repeating the ecosystem and every
  # option alongside it.
  #
  # This buys version updates and nothing else. Security updates always run
  # against the default branch whatever `target-branch` says, so an advisory
  # against jszip opens a pull request against master — which does not depend on
  # it — and none here. That is why docs/RELEASING.md still says to run
  # `npm audit` against 0.2.x by hand before a maintenance release.
  - package-ecosystem: npm
    directory: /
    target-branch: "0.2.x"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  # 0.2.x carries its own ci.yml and publish.yml, with their own SHA pins.
  - package-ecosystem: github-actions
    directory: /
    target-branch: "0.2.x"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
