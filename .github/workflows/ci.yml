name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 is the declared engines floor and must stay covered exactly;
        # 22 and 24 are the active LTS lines. 26 is still Current — it is here
        # ahead of its 2026-10-28 LTS promotion, so that a break surfaces before
        # it is the version callers are actually on.
        node-version: ["20.19.0", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      # `npm test` builds first, so this also proves the TypeScript sources
      # compile on every supported Node version.
      - run: npm test
      - name: Preview npm tarball contents
        run: npm pack --dry-run

  # The rest of the suite proves the archive is well-formed and the XML parses.
  # Only this job proves a spreadsheet application will open the result. It runs
  # once rather than across the matrix: the reader is what is under test here,
  # and it does not vary with the Node version.
  spreadsheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # libreoffice-calc, not libreoffice: without the spreadsheet component
      # every conversion fails with a generic error that reads like a corrupt
      # workbook. See docs/verifying-output.md.
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: npm ci --ignore-scripts
      # Without this the spreadsheet checks skip silently when LibreOffice is
      # missing, which is right on a contributor's machine and would make this
      # job pass while verifying nothing.
      - run: npm test
        env:
          XLSX_REQUIRE_SPREADSHEET: "1"

  # The spreadsheet job proves a reader accepts the output. This one proves it
  # conforms to the format as specified, using Microsoft's own validator — a
  # different question, and the one Excel actually enforces. Excel cannot run
  # here; docs/verifying-output.md records why, and what this does not replace.
  #
  # .NET is installed only in this job. Nothing local or published needs it.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: npm ci --ignore-scripts
      # Same reason as XLSX_REQUIRE_SPREADSHEET above: without it a runner that
      # loses .NET passes this job while checking nothing.
      - run: npm test
        env:
          XLSX_REQUIRE_SCHEMA: "1"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      # This package ships to npm, so a low-severity advisory anywhere in the
      # tree is still a regression worth failing on. The tree is small enough
      # that keeping it at zero is realistic.
      - run: npm audit --audit-level=low

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists PR commits via the API on pull_request events
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (regex secret scan over full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # contents:read only — commenting on PRs would 403 (Resource not accessible)
          GITLEAKS_ENABLE_COMMENTS: false
